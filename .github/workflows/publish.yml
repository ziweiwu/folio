name: publish

# Publishing is triggered by cutting a GitHub Release, so the tag, the release
# notes and the npm version are all decided in one place and by a human.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Trusted publishing: npm accepts a short-lived OIDC token minted for this
      # workflow instead of a long-lived NPM_TOKEN secret. Nothing to store, and
      # nothing to leak. Provenance is attested automatically as part of it.
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      # Node 22 ships npm 10, which predates trusted publishing.
      - run: npm install -g npm@latest

      - run: npm ci

      # Fail before publishing rather than after: a version number cannot be
      # reused once it is burned, even if the release is unpublished.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Check the tag matches the version in package.json
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$pkg" ]; then
            echo "release tag $GITHUB_REF_NAME does not match package version $pkg" >&2
            exit 1
          fi

      # No NODE_AUTH_TOKEN: authentication is the OIDC token from id-token above.
      - run: npm publish
